server.port=8080
spring.datasource.url=jdbc:sqlite:${DB_PATH:../sl_perfumaria.db}?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
backup.dir=${BACKUP_DIR:G:/My Drive/SL Perfumaria Backups}
backup.cron=${BACKUP_CRON:0 0 */6 * * *}
backup.keep=${BACKUP_KEEP:30}
